name: "Battery Backend"
description: "Recoit les rapports de l'ESP32 et publie les batteries dans Home Assistant via MQTT"
version: "1.0.2"
slug: "battery_backend"
init: false
arch:
  - aarch64
  - amd64
startup: application
watchdog: "http://[HOST]:[PORT:8000]/health"
boot: auto
ports:
  8000/tcp: 8000
options:
  api_key: "change-moi-en-vrai-secret"
  sensor_expire_after: 900
  batteries:
    - id: "AA:BB:CC:DD:EE:FF"
      name: "battery_1"
    - id: "11:22:33:44:55:66"
      name: "battery_2"
schema:
  api_key: password
  sensor_expire_after: int(0,86400)
  batteries:
    - id: "match(^[A-Za-z0-9:_-]{1,64}$)"
      name: "match(^[a-z0-9_]{1,40}$)"
services:
  - "mqtt:want"