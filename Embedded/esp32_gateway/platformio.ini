; Passerelle ESP32 : batterie BLE <-> serveur (add-on Home Assistant)
;
; Le protocole BMS est partage avec le simulateur : il reste dans
; Embedded/bms_protocol.h, ajoute au chemin d'inclusion via -I ..
;
; Chaque carte existe en deux modes :
;   debug   : traces serie actives (-DDEBUG_ENABLE, voir src/debug.h)
;   release : aucune trace serie, pour l'installation sur le bateau
;
; Liaison internet, selon la carte :
;   lilygo-*   : modem LTE-M SIM7080G de la LILYGO T-SIM7080G-S3 (-DNETWORK_GSM, src/network_gsm.cpp)
;   esp32dev-* : WiFi, banc de test sans consommer de data (-DNETWORK_WIFI, src/network_wifi.cpp)
; Le HTTPS (TLS verifie par l'ESP32) est commun aux deux (src/report.cpp).
;
; Environnements : lilygo-debug (defaut), lilygo-release, esp32dev-debug, esp32dev-release
;
; Compiler   : pio run -e lilygo-release
; Televerser : pio run -e lilygo-release -t upload
; Moniteur   : pio device monitor   (utile en debug seulement)

[platformio]
default_envs = lilygo-debug

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -I ..
    -I ../include
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^6.21.5
    digitaldragon/SSLClient@^1.3.2              ; TLS mbedtls au-dessus de n'importe quel client TCP
    arduino-libraries/ArduinoHttpClient@^0.6.1

; ---------------- Modes ----------------
[mode_debug]
build_flags =
    -DDEBUG_ENABLE

[mode_release]
build_flags =

; ---------------- Cartes ----------------
; Cible finale : LILYGO T-SIM7080G-S3 (ESP32-S3, 16 Mo flash, 8 Mo PSRAM)
[board_lilygo]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; port serie sur l'USB natif de l'ESP32-S3
    -DNETWORK_GSM
    ; -DGSM_DUMP_AT_COMMANDS      ; (build debug) affiche tous les echanges AT avec le modem
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.12.0
    lewisxhe/XPowersLib@^0.3.3                  ; PMU AXP2101 : alimentation du modem
    vshymanskyy/StreamDebugger@^1.0.1           ; pour GSM_DUMP_AT_COMMANDS

; ESP32 classique (carte de developpement, banc de test)
[board_esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv   ; WiFi + BLE + TLS : ~90 % de la partition par defaut (pas d'OTA)
build_flags =
    -DNETWORK_WIFI

; ---------------- Environnements = carte + mode ----------------
[env:lilygo-debug]
extends = board_lilygo
build_flags =
    ${env.build_flags}
    ${board_lilygo.build_flags}
    ${mode_debug.build_flags}

[env:lilygo-release]
extends = board_lilygo
build_flags =
    ${env.build_flags}
    ${board_lilygo.build_flags}
    ${mode_release.build_flags}

[env:esp32dev-debug]
extends = board_esp32dev
build_flags =
    ${env.build_flags}
    ${board_esp32dev.build_flags}
    ${mode_debug.build_flags}

[env:esp32dev-release]
extends = board_esp32dev
build_flags =
    ${env.build_flags}
    ${board_esp32dev.build_flags}
    ${mode_release.build_flags}
