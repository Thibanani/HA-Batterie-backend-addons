; Passerelle ESP32 : batterie BLE <-> serveur (add-on Home Assistant)
;
; Le protocole BMS est partage avec le simulateur : il reste dans
; Embedded/bms_protocol.h, ajoute au chemin d'inclusion via -I ..
;
; Compiler   : pio run -e lilygo-t-sim7080g-s3
; Televerser : pio run -e lilygo-t-sim7080g-s3 -t upload
; Moniteur   : pio device monitor

[platformio]
default_envs = lilygo-t-sim7080g-s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -I ..
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^6.21.5

; Cible finale : LILYGO T-SIM7080G-S3 (ESP32-S3, 16 Mo flash, 8 Mo PSRAM)
[env:lilygo-t-sim7080g-s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; port serie sur l'USB natif de l'ESP32-S3

; ESP32 classique (carte de developpement, banc de test)
[env:esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv   ; WiFi + BLE + TLS : ~90 % de la partition par defaut (pas d'OTA)
